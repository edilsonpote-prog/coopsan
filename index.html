<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperativa de Transporte S.A.N</title>
    <style>
        :root {
            --naranja-coop: #ff711e;
            --azul-coop: #0d2a71;
            --amarillo-ruta: #ffcc00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--naranja-coop);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 🎬 VIDEO DE FONDO QUE CUBRE TODO */
        header {
            position: relative;
            width: 100%;
            height: 100vh; /* Ocupa toda la pantalla */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        header video.background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Oscurece un poco el video */
            z-index: 2;
        }

        .header-content {
            position: relative;
            z-index: 3;
            color: white;
            padding: 20px;
        }

        /* 🔊 ESTILO DEL BOTÓN DE AUDIO */
        #audioToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        #audioToggle:hover { transform: scale(1.1); background: var(--naranja-coop); }

        header::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 10px;
            background: repeating-linear-gradient(to right, var(--amarillo-ruta) 0, var(--amarillo-ruta) 40px, transparent 40px, transparent 80px);
            z-index: 4;
        }

        /* Animación de escritura */
        .typing-container { display: inline-block; }
        header h1 {
            font-size: clamp(24px, 8vw, 50px);
            font-weight: 900;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            border-right: 4px solid var(--amarillo-ruta);
            width: 0;
            animation: typing 3.5s steps(30) forwards, blink .7s infinite;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }

        .btn-ruta {
            margin-top: 25px;
            padding: 15px 35px;
            background: var(--amarillo-ruta);
            color: var(--azul-coop);
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<header>
    <video autoplay muted loop playsinline class="background-video" id="videoFondo">
        <source src="video coop.mp4" type="video/mp4">
    </video>

    <button id="audioToggle">🔇</button>

    <div class="header-content">
        <div class="typing-container">
            <h1>Cooperativa de Transporte S.A.N</h1>
        </div>
        <p>"Conectando vidas, kilómetros y destinos desde nuestros inicios."</p>
        <a href="gasolinera.html" class="btn-ruta">Ver Servicios</a>
    </div>
</header>

<section>
    </section>

<div id="footer-container"></div>

<script src="modelo.js"></script>
</body>
</html>
<div id="footer-container"></div>

<script src="modelo.js"></script>
</body>
</html>
