<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperativa de Transporte S.A.N</title>
    <style>
        :root {
            --naranja-coop: #ff711e;
            --azul-coop: #0d2a71;
            --amarillo-ruta: #ffcc00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--naranja-coop);
            color: #333;
            line-height: 1.6;
        }

        /* 🛣️ CABECERA CON VIDEO CORREGIDA */
        header {
            position: relative;
            height: 80vh; /* Altura más profesional */
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            text-align: center;
            background: #000; /* Fondo negro mientras carga el video */
        }

        /* El video ahora sí se posiciona correctamente al fondo */
        .video-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 0;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        /* Capa oscura necesaria para que el texto blanco se lea bien */
        header::before {
            content: "";
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 1;
        }

        /* Forzamos al texto a estar por encima del video y la capa oscura */
        .typing-container, header p, .btn-ruta {
            position: relative;
            z-index: 2;
        }

        header h1 {
            font-size: clamp(24px, 8vw, 50px);
            font-weight: 900;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            border-right: 4px solid var(--amarillo-ruta);
            /* Animación: el cursor desaparece tras 5 parpadeos */
            animation: typing 3.5s steps(30) forwards, blink .7s step-end 5;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: var(--amarillo-ruta); }
        }

        /* Estilos de botones y secciones se mantienen igual */
        .btn-ruta {
            margin-top: 25px;
            padding: 15px 35px;
            background: var(--amarillo-ruta);
            color: var(--azul-coop);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .info-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 10px solid var(--azul-coop);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: white;
            font-size: 28px;
            background: var(--azul-coop);
            padding: 10px 20px;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>

<header>
    <video autoplay muted loop playsinline class="video-bg">
        <source src="video.mp4" type="video/mp4">
        Tu navegador no soporta video.
    </video>

    <div class="typing-container">
        <h1>Cooperativa de Transporte S.A.N</h1>
    </div>
    <p>"Conectando vidas, kilómetros y destinos desde nuestros inicios."</p>
    <a href="gasolinera.html" class="btn-ruta">Ver Servicios</a>
</header>

</body>
</html>
