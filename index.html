<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperativa de Transporte S.A.N</title>
    <style>
        :root {
            --naranja-coop: #ff711e;
            --azul-coop: #0d2a71;
            --amarillo-ruta: #ffcc00;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: var(--naranja-coop);
            color: #333;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 🎬 VIDEO DE FONDO COMPLETO */
        header {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
        }

        header video.background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: 1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 2;
        }

        .header-content {
            position: relative;
            z-index: 3;
            color: white;
            padding: 20px;
        }

        /* 🔊 BOTÓN DE AUDIO CON ANIMACIÓN */
        #audioToggle {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(0,0,0,0.6);
            color: white;
            border: 2px solid white;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            cursor: pointer;
            font-size: 22px;
            transition: all 0.4s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        /* Clase que activaremos con JS cuando el audio suene */
        #audioToggle.active {
            background: var(--naranja-coop);
            box-shadow: 0 0 15px var(--naranja-coop);
            transform: scale(1.1);
        }

        header::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 10px;
            background: repeating-linear-gradient(to right, var(--amarillo-ruta) 0, var(--amarillo-ruta) 40px, transparent 40px, transparent 80px);
            z-index: 4;
        }

        /* Animación de escritura */
        .typing-container { display: inline-block; margin-bottom: 20px; }
        header h1 {
            font-size: clamp(28px, 9vw, 60px);
            font-weight: 900;
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            border-right: 4px solid var(--amarillo-ruta);
            width: 0;
            animation: typing 3.5s steps(30) forwards, blink .7s infinite;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }

        @keyframes typing { from { width: 0; } to { width: 100%; } }
        @keyframes blink { 50% { border-color: transparent; } }

        .btn-ruta {
            margin-top: 30px;
            padding: 15px 40px;
            background: var(--amarillo-ruta);
            color: var(--azul-coop);
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .btn-ruta:hover { background: white; transform: translateY(-3px); }

        section { padding: 80px 20px; max-width: 1100px; margin: auto; }
        .info-box { background: white; padding: 30px; border-radius: 15px; border-left: 10px solid var(--azul-coop); margin-bottom: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: white; background: var(--azul-coop); padding: 10px 20px; border-radius: 8px; display: inline-block; margin-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <video autoplay muted loop playsinline class="background-video" id="videoFondo">
        <source src="video coop.mp4" type="video/mp4">
    </video>

    <button id="audioToggle">🔇</button>

    <div class="header-content">
        <div class="typing-container">
            <h1>Cooperativa de Transporte S.A.N</h1>
        </div>
        <p>"Conectando vidas, kilómetros y destinos desde nuestros inicios."</p>
        <a href="gasolinera.html" class="btn-ruta">Ver Servicios</a>
    </div>
</header>

<section>
    <h2>Sobre Nosotros</h2>
    <div class="info-box">
        <p>La <strong>Cooperativa de Transporte S.A.N</strong> es una organización líder en el transporte interprovincial y rural...</p>
    </div>
</section>

<div id="footer-container"></div>

<script src="modelo.js"></script>
</body>
</html>
